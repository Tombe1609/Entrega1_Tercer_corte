services:
  - type: web
    name: cooperativa-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: ">=24 <25"
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        sync: false
