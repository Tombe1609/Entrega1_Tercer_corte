$kind: http-request
description: |-
  **Historia de usuario 7:** Como estudiante, quiero consultar mis préstamos y saldos pendientes, para conocer cuánto capital e interés debo.

  Solo se admiten los estados activo o pagado.

  **Código HTTP esperado:** 400
url: "{{baseUrl}}/api/estudiantes/U003/prestamos?estado=cualquiera"
method: GET
queryParams:
  estado: cualquiera
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 400", function () { pm.response.to.have.status(400); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = false", function () { pm.expect(json.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/HU7 - Filtro de estado inválido (error 400).resources/examples
order: 4000
