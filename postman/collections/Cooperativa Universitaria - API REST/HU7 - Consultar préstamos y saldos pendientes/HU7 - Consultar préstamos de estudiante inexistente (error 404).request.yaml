$kind: http-request
description: |-
  **Historia de usuario 7:** Como estudiante, quiero consultar mis préstamos y saldos pendientes, para conocer cuánto capital e interés debo.

  El estudiante U999 no existe.

  **Código HTTP esperado:** 404
url: "{{baseUrl}}/api/estudiantes/U999/prestamos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 404", function () { pm.response.to.have.status(404); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = false", function () { pm.expect(json.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/HU7 - Consultar préstamos de estudiante inexistente (error 404).resources/examples
order: 3000
