$kind: http-request
description: |-
  **Historia de usuario 7:** Como estudiante, quiero consultar mis préstamos y saldos pendientes, para conocer cuánto capital e interés debo.

  Préstamos del estudiante con su finalidad y saldos pendientes.

  **Código HTTP esperado:** 200
url: "{{baseUrl}}/api/estudiantes/U003/prestamos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("1 préstamo", function () { pm.expect(json.data.cantidad_prestamos === 1).to.be.true; });
      pm.test("finalidad Compra de libros", function () { pm.expect(json.data.prestamos[0].finalidad === 'Compra de libros').to.be.true; });
    language: text/javascript
examples: ./.resources/★ HU7 - Consultar préstamos de U003.resources/examples
order: 1000
