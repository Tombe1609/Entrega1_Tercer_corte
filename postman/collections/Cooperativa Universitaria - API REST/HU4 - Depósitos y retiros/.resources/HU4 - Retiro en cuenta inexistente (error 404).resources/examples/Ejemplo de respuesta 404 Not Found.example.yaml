$kind: http-example
request:
  url: "{{baseUrl}}/api/ahorros/A999/retiros"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "valor": 1000
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "No existe una cuenta de ahorro con id A999."
      }
order: 1000
