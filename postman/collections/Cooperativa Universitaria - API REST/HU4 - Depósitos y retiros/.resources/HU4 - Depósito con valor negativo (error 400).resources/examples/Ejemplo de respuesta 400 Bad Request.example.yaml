$kind: http-example
request:
  url: "{{baseUrl}}/api/ahorros/{{ahorro_nuevo}}/depositos"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "valor": -5000
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Los datos enviados no son válidos.",
        "errors": [
          "El campo \"valor\" debe ser mayor que cero."
        ]
      }
order: 1000
