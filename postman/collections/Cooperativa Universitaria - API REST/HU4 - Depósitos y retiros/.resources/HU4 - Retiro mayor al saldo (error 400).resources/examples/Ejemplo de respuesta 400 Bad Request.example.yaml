$kind: http-example
request:
  url: "{{baseUrl}}/api/ahorros/{{ahorro_nuevo}}/retiros"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "valor": 5000000
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Saldo insuficiente: el saldo actual es 200000 y el retiro es 5000000."
      }
order: 1000
