$kind: http-request
description: |-
  **Historia de usuario 4:** Como estudiante, quiero realizar depósitos o retiros, para mantener actualizado mi saldo de ahorro y consultar los movimientos.

  No se permiten valores negativos.

  **Código HTTP esperado:** 400
url: "{{baseUrl}}/api/ahorros/{{ahorro_nuevo}}/depositos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "valor": -5000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 400", function () { pm.response.to.have.status(400); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = false", function () { pm.expect(json.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/HU4 - Depósito con valor negativo (error 400).resources/examples
order: 4000
