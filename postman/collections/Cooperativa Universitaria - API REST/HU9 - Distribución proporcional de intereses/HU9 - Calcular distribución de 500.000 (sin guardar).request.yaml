$kind: http-request
description: |-
  **Historia de usuario 9:** Como sistema, quiero distribuir los intereses generados por los préstamos proporcionalmente entre los estudiantes ahorradores, para reconocer su participación en el fondo de la cooperativa.

  Calcula la participación de cada ahorrador. Como en HU3/HU4 se creó la cuenta A011 con 200.000, el total ahorrado es 27.200.000 (27.000.000 si no se ejecutaron esas peticiones).

  **Código HTTP esperado:** 200
url: "{{baseUrl}}/api/distribucion-intereses/calculo?intereses_generados=500000"
method: GET
queryParams:
  intereses_generados: "500000"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("11 ahorradores", function () { pm.expect(json.data.cantidad_ahorradores === 11).to.be.true; });
      pm.test("total 27200000", function () { pm.expect(json.data.total_ahorrado === 27200000).to.be.true; });
    language: text/javascript
examples: ./.resources/HU9 - Calcular distribución de 500.000 (sin guardar).resources/examples
order: 1000
