$kind: http-example
request:
  url: "{{baseUrl}}/api/distribucion-intereses"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "periodo": "2026-04",
        "intereses_generados": 500000
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Ya existe una distribución registrada para el periodo 2026-04."
      }
order: 1000
