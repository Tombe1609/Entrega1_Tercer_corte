$kind: http-request
description: |-
  **Historia de usuario 6:** Como funcionario, quiero calcular el interés del préstamo aplicando una tasa del 5 %, para conocer el valor total que debe pagar el estudiante.

  P004 tiene capital inicial 5.000.000 y pendiente 3.000.000: se muestran ambos cálculos.

  **Código HTTP esperado:** 200
url: "{{baseUrl}}/api/prestamos/P004/interes"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("interés sobre pendiente 150000", function () { pm.expect(json.data.sobre_capital_pendiente.interes_calculado === 150000).to.be.true; });
    language: text/javascript
examples: ./.resources/HU6 - Calcular interés del préstamo P004 (con abono previo).resources/examples
order: 2000
