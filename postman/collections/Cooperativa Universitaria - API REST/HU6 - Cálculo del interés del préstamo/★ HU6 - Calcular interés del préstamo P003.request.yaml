$kind: http-request
description: |-
  **Historia de usuario 6:** Como funcionario, quiero calcular el interés del préstamo aplicando una tasa del 5 %, para conocer el valor total que debe pagar el estudiante.

  Capital 3.000.000 × 5 % = 150.000; total = 3.150.000. Solo consulta, no modifica datos.

  **Código HTTP esperado:** 200
url: "{{baseUrl}}/api/prestamos/P003/interes"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("interés 150000", function () { pm.expect(json.data.sobre_capital_inicial.interes_calculado === 150000).to.be.true; });
      pm.test("total 3150000", function () { pm.expect(json.data.sobre_capital_inicial.total_calculado === 3150000).to.be.true; });
    language: text/javascript
examples: ./.resources/★ HU6 - Calcular interés del préstamo P003.resources/examples
order: 1000
