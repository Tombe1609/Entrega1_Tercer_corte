$kind: http-example
request:
  url: "{{baseUrl}}/api/prestamos/P003/pagos"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "tipo_abono": "capital",
        "valor": 99000000
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "El abono (99000000) supera el capital pendiente (2000000)."
      }
order: 1000
