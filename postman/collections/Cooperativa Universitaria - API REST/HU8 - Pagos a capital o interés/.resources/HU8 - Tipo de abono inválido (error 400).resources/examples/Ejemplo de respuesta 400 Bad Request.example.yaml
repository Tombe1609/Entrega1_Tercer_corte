$kind: http-example
request:
  url: "{{baseUrl}}/api/prestamos/P003/pagos"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "tipo_abono": "otro",
        "valor": 1000
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Los datos enviados no son válidos.",
        "errors": [
          "El campo \"tipo_abono\" debe ser uno de: capital, interes."
        ]
      }
order: 1000
