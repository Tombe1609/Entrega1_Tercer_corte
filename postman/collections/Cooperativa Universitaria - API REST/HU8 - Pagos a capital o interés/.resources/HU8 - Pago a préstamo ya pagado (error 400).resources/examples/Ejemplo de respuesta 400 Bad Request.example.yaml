$kind: http-example
request:
  url: "{{baseUrl}}/api/prestamos/P007/pagos"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "tipo_abono": "capital",
        "valor": 1000
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "El préstamo P007 no está activo (estado: pagado)."
      }
order: 1000
