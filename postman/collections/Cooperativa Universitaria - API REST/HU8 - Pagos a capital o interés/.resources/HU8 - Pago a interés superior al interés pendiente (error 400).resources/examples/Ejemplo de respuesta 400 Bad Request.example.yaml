$kind: http-example
request:
  url: "{{baseUrl}}/api/prestamos/P008/pagos"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "tipo_abono": "interes",
        "valor": 999999
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "El pago (999999) supera el interés pendiente (100000)."
      }
order: 1000
