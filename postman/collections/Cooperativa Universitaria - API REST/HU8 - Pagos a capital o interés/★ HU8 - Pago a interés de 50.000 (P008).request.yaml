$kind: http-request
description: |-
  **Historia de usuario 8:** Como estudiante, quiero realizar un pago y seleccionar si deseo abonarlo al capital o al interés, para controlar la forma en que disminuye mi deuda.

  El interés pendiente baja de 150.000 a 100.000 y el capital (3.000.000) no cambia. Se registra el pago PG005.

  **Código HTTP esperado:** 201
url: "{{baseUrl}}/api/prestamos/P008/pagos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo_abono": "interes",
      "valor": 50000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 201", function () { pm.response.to.have.status(201); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("capital sin cambio", function () { pm.expect(json.data.prestamo.capital_pendiente === 3000000).to.be.true; });
      pm.test("interés 100000", function () { pm.expect(json.data.prestamo.interes_pendiente === 100000).to.be.true; });
    language: text/javascript
examples: ./.resources/★ HU8 - Pago a interés de 50.000 (P008).resources/examples
order: 2000
