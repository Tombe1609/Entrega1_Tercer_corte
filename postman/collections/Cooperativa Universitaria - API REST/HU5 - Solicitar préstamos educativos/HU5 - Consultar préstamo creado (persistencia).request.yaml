$kind: http-request
description: |-
  **Historia de usuario 5:** Como estudiante, quiero solicitar un préstamo indicando su finalidad educativa, para obtener financiación destinada exclusivamente a mis estudios.

  Confirma que P009 quedó guardado.

  **Código HTTP esperado:** 200
url: "{{baseUrl}}/api/prestamos/{{prestamo_nuevo}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("capital pendiente 1000000", function () { pm.expect(json.data.capital_pendiente === 1000000).to.be.true; });
    language: text/javascript
examples: ./.resources/HU5 - Consultar préstamo creado (persistencia).resources/examples
order: 8000
