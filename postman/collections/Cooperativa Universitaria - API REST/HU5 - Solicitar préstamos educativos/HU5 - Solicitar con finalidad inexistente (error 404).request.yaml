$kind: http-request
description: |-
  **Historia de usuario 5:** Como estudiante, quiero solicitar un préstamo indicando su finalidad educativa, para obtener financiación destinada exclusivamente a mis estudios.

  La finalidad FE999 no existe.

  **Código HTTP esperado:** 404
url: "{{baseUrl}}/api/prestamos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "usuario_id": "U010",
      "fin_id": "FE999",
      "monto": 500000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 404", function () { pm.response.to.have.status(404); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = false", function () { pm.expect(json.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/HU5 - Solicitar con finalidad inexistente (error 404).resources/examples
order: 6000
