$kind: http-request
description: |-
  **Historia de usuario 5:** Como estudiante, quiero solicitar un préstamo indicando su finalidad educativa, para obtener financiación destinada exclusivamente a mis estudios.

  Falta el campo obligatorio "monto".

  **Código HTTP esperado:** 400
url: "{{baseUrl}}/api/prestamos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "usuario_id": "U010",
      "fin_id": "FE001"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 400", function () { pm.response.to.have.status(400); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = false", function () { pm.expect(json.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/HU5 - Solicitar sin monto (error 400).resources/examples
order: 7000
