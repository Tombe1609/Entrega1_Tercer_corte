$kind: http-example
request:
  url: "{{baseUrl}}/api/prestamos"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "usuario_id": "U010",
        "fin_id": "FE999",
        "monto": 500000
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "No existe la finalidad educativa FE999."
      }
order: 1000
