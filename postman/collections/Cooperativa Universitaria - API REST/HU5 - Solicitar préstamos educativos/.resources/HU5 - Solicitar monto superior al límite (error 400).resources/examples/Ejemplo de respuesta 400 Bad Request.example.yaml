$kind: http-example
request:
  url: "{{baseUrl}}/api/prestamos"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "usuario_id": "U010",
        "fin_id": "FE002",
        "monto": 6000000
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "El monto supera el límite permitido de 5000000."
      }
order: 1000
