$kind: http-example
request:
  url: "{{baseUrl}}/api/prestamos"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "usuario_id": "U009",
        "fin_id": "FE001",
        "monto": 500000
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "El estudiante ya tiene un préstamo activo (P009)."
      }
order: 1000
