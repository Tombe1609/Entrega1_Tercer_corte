$kind: http-request
description: |-
  **Historia de usuario 2:** Como Rector, quiero registrar funcionarios con diferentes cargos, para delegar actividades administrativas de la cooperativa.

  No existe F999.

  **Código HTTP esperado:** 404
url: "{{baseUrl}}/api/funcionarios/F999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 404", function () { pm.response.to.have.status(404); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = false", function () { pm.expect(json.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/HU2 - Consultar funcionario inexistente (error 404).resources/examples
order: 5000
