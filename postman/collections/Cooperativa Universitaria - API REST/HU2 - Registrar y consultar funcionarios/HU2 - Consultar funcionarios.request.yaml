$kind: http-request
description: |-
  **Historia de usuario 2:** Como Rector, quiero registrar funcionarios con diferentes cargos, para delegar actividades administrativas de la cooperativa.

  Lista los funcionarios (5 iniciales + el nuevo).

  **Código HTTP esperado:** 200
url: "{{baseUrl}}/api/funcionarios"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("6 funcionarios", function () { pm.expect(json.data.cantidad === 6).to.be.true; });
    language: text/javascript
examples: ./.resources/HU2 - Consultar funcionarios.resources/examples
order: 3000
