$kind: http-request
description: |-
  **Historia de usuario 2:** Como Rector, quiero registrar funcionarios con diferentes cargos, para delegar actividades administrativas de la cooperativa.

  Confirma que quedó guardado.

  **Código HTTP esperado:** 200
url: "{{baseUrl}}/api/funcionarios/{{funcionario_nuevo}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("cargo correcto", function () { pm.expect(json.data.cargo === 'Coordinador de cartera').to.be.true; });
    language: text/javascript
examples: ./.resources/HU2 - Consultar funcionario creado (persistencia).resources/examples
order: 4000
