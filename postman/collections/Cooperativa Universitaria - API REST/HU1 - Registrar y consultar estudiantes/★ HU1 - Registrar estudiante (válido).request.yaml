$kind: http-request
description: |-
  **Historia de usuario 1:** Como administrador, quiero registrar un estudiante y consultar sus datos, para permitirle utilizar los servicios de ahorro y crédito educativo.

  Crea el estudiante U012 en la colección `usuarios`. Efecto: modifica datos; para repetirlo hay que reiniciar la base (ver README).

  **Código HTTP esperado:** 201
url: "{{baseUrl}}/api/estudiantes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Daniel Esteban Molina",
      "documento": "1001001012",
      "telefono": "3001111012",
      "email": "daniel.molina@universidad.edu.co"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 201", function () { pm.response.to.have.status(201); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("id generado U012", function () { pm.expect(json.data.usuario_id === 'U012').to.be.true; });
      pm.test("tipo estudiante", function () { pm.expect(json.data.tipo === 'estudiante').to.be.true; });
      pm.collectionVariables.set("usuario_nuevo", json.data.usuario_id);
    language: text/javascript
examples: ./.resources/★ HU1 - Registrar estudiante (válido).resources/examples
order: 1000
