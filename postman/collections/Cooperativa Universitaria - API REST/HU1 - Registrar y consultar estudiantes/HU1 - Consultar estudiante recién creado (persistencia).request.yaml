$kind: http-request
description: |-
  **Historia de usuario 1:** Como administrador, quiero registrar un estudiante y consultar sus datos, para permitirle utilizar los servicios de ahorro y crédito educativo.

  Confirma que el registro quedó guardado en MongoDB.

  **Código HTTP esperado:** 200
url: "{{baseUrl}}/api/estudiantes/{{usuario_nuevo}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("nombre correcto", function () { pm.expect(json.data.nombre === 'Daniel Esteban Molina').to.be.true; });
    language: text/javascript
examples: ./.resources/HU1 - Consultar estudiante recién creado (persistencia).resources/examples
order: 5000
