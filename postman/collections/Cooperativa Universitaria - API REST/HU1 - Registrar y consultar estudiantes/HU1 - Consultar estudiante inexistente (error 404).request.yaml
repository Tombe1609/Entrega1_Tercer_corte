$kind: http-request
description: |-
  **Historia de usuario 1:** Como administrador, quiero registrar un estudiante y consultar sus datos, para permitirle utilizar los servicios de ahorro y crédito educativo.

  No existe el estudiante U999.

  **Código HTTP esperado:** 404
url: "{{baseUrl}}/api/estudiantes/U999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 404", function () { pm.response.to.have.status(404); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = false", function () { pm.expect(json.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/HU1 - Consultar estudiante inexistente (error 404).resources/examples
order: 6000
