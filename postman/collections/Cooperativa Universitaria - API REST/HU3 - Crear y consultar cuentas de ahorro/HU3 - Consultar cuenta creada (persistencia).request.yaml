$kind: http-request
description: |-
  **Historia de usuario 3:** Como estudiante, quiero abrir una cuenta de ahorro, para depositar y administrar mi dinero dentro de la cooperativa.

  Confirma que la cuenta quedó guardada.

  **Código HTTP esperado:** 200
url: "{{baseUrl}}/api/ahorros/{{ahorro_nuevo}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("usuario correcto", function () { pm.expect(json.data.usuario_id === 'U012').to.be.true; });
    language: text/javascript
examples: ./.resources/HU3 - Consultar cuenta creada (persistencia).resources/examples
order: 4000
