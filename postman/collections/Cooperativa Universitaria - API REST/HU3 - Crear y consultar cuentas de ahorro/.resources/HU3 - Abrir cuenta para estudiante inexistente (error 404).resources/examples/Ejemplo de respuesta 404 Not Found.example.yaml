$kind: http-example
request:
  url: "{{baseUrl}}/api/ahorros"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "usuario_id": "U999"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "No existe un estudiante con id U999."
      }
order: 1000
