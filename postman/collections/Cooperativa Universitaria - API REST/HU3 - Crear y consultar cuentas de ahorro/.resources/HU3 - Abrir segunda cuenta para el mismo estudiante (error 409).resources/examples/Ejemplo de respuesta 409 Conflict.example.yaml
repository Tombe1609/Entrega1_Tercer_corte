$kind: http-example
request:
  url: "{{baseUrl}}/api/ahorros"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "usuario_id": "{{usuario_nuevo}}"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "El estudiante ya tiene una cuenta de ahorro."
      }
order: 1000
