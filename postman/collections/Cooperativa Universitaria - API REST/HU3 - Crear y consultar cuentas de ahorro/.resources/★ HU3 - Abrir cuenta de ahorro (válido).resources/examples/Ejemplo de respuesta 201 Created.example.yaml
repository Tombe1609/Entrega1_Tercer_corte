$kind: http-example
request:
  url: "{{baseUrl}}/api/ahorros"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "usuario_id": "{{usuario_nuevo}}"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Cuenta de ahorro creada correctamente.",
        "data": {
          "ahorro_id": "A011",
          "usuario_id": "U012",
          "saldo": 0,
          "estado": "activo"
        }
      }
order: 1000
