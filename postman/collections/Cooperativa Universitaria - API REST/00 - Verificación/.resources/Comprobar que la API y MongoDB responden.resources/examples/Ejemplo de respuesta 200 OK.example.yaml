$kind: http-example
request:
  url: "{{baseUrl}}/api/health"
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "La API y la base de datos están disponibles.",
        "data": {
          "api": "activa",
          "mongodb": "conectado"
        }
      }
order: 1000
