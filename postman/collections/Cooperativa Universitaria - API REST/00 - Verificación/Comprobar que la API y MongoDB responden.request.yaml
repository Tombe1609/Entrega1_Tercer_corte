$kind: http-request
description: |-
  Verifica que el servidor está activo y conectado a MongoDB.

  **Código HTTP esperado:** 200
url: "{{baseUrl}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("La respuesta es JSON con success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("mongodb conectado", function () { pm.expect(json.data.mongodb === 'conectado').to.be.true; });
    language: text/javascript
examples: ./.resources/Comprobar que la API y MongoDB responden.resources/examples
order: 1000
